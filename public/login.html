<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090B; --surface:#111317; --panel:#15181D;
  --line:rgba(199,203,209,.17); --line-2:rgba(199,203,209,.30);
  --accent:#FFBB00; --accent-hi:#FFCE47; --accent-soft:rgba(255,206,71,.6);
  --accent-faint:rgba(255,187,0,.10);
  --text:#F5F5F5; --muted:#C7CBD1; --dim:#8A9099;
  --danger:#FFBB00; --ok:#FFCE47;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:32px 18px calc(32px + env(safe-area-inset-bottom));
  position:relative;
}
/* faint grid + vignette, no colour noise */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
  opacity:.5;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 46% at 50% -10%,rgba(255,187,0,.15),transparent 64%),
    radial-gradient(90% 58% at 50% 110%,rgba(255,206,71,.07),transparent 68%),
    radial-gradient(circle at 50% 42%,transparent 30%,rgba(0,0,0,.6) 82%);
}

/* ══════════ HEADER ══════════ */
.top{
  position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 20px 0;
}
.top-brand{display:flex;align-items:center;gap:9px}
.top-brand .brand-mark{
  width:20px;height:20px;object-fit:contain;flex-shrink:0;display:block;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
}
.top-brand span{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;
  text-transform:uppercase;color:#BAC0C8;
}
.top-link{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#A9AFB7;text-decoration:none;padding:7px 12px;border-radius:7px;
  border:1px solid transparent;transition:color .2s,border-color .2s;
}
.top-link:hover{color:var(--accent);border-color:rgba(255,187,0,.22)}

/* ══════════ AUTH SHELL ══════════ */
.shell{
  position:relative;z-index:2;
  width:100%;max-width:392px;
  display:flex;flex-direction:column;gap:22px;
}

/* character stage. Sits above the card so the bot is never swallowed by
   the card's stacking order while it rolls in from the left. */
.stage{
  position:relative;z-index:2;
  height:132px;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;
}

/* ══════════ BOT ══════════
   A small machined robot: layered metal plates, brushed highlights,
   a glass visor with a real specular sweep, and a soft amber optic.
   Everything is CSS — no images, no new palette.                      */
.bot{
  position:relative;
  width:104px;height:112px;
  transform:translateY(14px) scale(.94);
  /* spin about the machine's own vertical centre axis, in place */
  transform-origin:50% 50%;
  opacity:0;
  transition:none;
}
/* one full 360° 3D turn on the spot — no travel at all, then a long natural
   deceleration that leaves the machine upright exactly where it started.
   translateY/scale are repeated so the finished state is pixel-identical to
   the resting .bot transform above. */
/* whole-body float — the machine hovers on a tiny antigrav
   (delayed so it starts only after the 360° entrance has finished) */
.bot-float{
  position:absolute;inset:0;
  animation:hover 4.4s ease-in-out 1.9s infinite;
}
@keyframes hover{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-3.5px)}
}

/* ── head ────────────────────────────────────────────────────────── */
.bot-head{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:66px;height:56px;
  border-radius:18px 18px 14px 14px;
  /* brushed metal: three stacked stops read as a curved plate */
  background:
    linear-gradient(180deg,#4A525C 0%,#2A2F36 18%,#191C21 62%,#111317 100%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:
    0 10px 24px rgba(0,0,0,.75),
    0 1px 0 rgba(255,255,255,.10) inset,
    0 -8px 16px rgba(0,0,0,.5) inset;
}
/* top plate seam — a real machined lip catching light */
.bot-head::before{
  content:'';position:absolute;left:8px;right:8px;top:5px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
}
/* chin vent */
.bot-head::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:7px;width:20px;height:2px;border-radius:2px;
  background:rgba(0,0,0,.75);
  box-shadow:0 1px 0 rgba(255,255,255,.07);
}

/* antenna + status bead */
.bot-antenna{
  position:absolute;left:50%;top:-11px;transform:translateX(-50%);
  width:2px;height:11px;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.06));
}
.bot-bead{
  position:absolute;left:50%;top:-16px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 6px rgba(255,187,0,.85),0 0 14px rgba(255,187,0,.35);
  animation:bead 2.6s ease-in-out 1.9s infinite;
}
@keyframes bead{
  0%,100%{opacity:1;box-shadow:0 0 6px rgba(255,187,0,.85),0 0 14px rgba(255,187,0,.35)}
  50%    {opacity:.45;box-shadow:0 0 3px rgba(255,187,0,.5),0 0 8px rgba(255,187,0,.18)}
}

/* ear servos */
.bot-ear{
  position:absolute;top:20px;width:5px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,#343A42,#15181D);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 1px 2px rgba(0,0,0,.7);
}
.bot-ear.l{left:-6px}
.bot-ear.r{right:-6px}

/* ── visor: curved dark glass with a specular sweep ──────────────── */
.bot-visor{
  position:absolute;left:50%;top:15px;transform:translateX(-50%);
  width:48px;height:24px;border-radius:11px;
  background:
    linear-gradient(168deg,#0B0D10 0%,#111317 45%,#0B0D10 100%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.9),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
/* glass reflection — the one thing that sells "real material" */
.bot-visor::before{
  content:'';position:absolute;left:-30%;top:-60%;
  width:70%;height:180%;
  background:linear-gradient(102deg,transparent,rgba(255,255,255,.16),transparent);
  transform:rotate(8deg);
  animation:glint 6.5s ease-in-out 1.9s infinite;
}
@keyframes glint{
  0%,72%,100%{transform:translateX(-40%) rotate(8deg)}
  84%        {transform:translateX(210%) rotate(8deg)}
}
/* faint inner glow so the glass reads as thin, not painted */
.bot-visor::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(ellipse at 50% 120%,rgba(255,187,0,.10),transparent 62%);
}

/* optic */
.bot-eye{
  position:absolute;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFEEBE 0%,var(--accent) 42%,#8A6500 100%);
  box-shadow:
    0 0 5px rgba(255,187,0,.9),
    0 0 12px rgba(255,187,0,.45),
    0 0 22px rgba(255,187,0,.18);
  animation:scan 5.2s ease-in-out 1.9s infinite;
}
.bot-eye.l{left:11px}
.bot-eye.r{right:11px}
/* blink: the optics iris down like a camera shutter */
@keyframes scan{
  0%,88%,100%{transform:translateY(-50%) scaleY(1);opacity:1}
  93%        {transform:translateY(-50%) scaleY(.12);opacity:.65}
}
/* asynchronous drift keeps the machine feeling alive, not looped */
.bot-eye.r{animation-delay:3.6s}

/* ── neck ────────────────────────────────────────────────────────── */
.bot-neck{
  position:absolute;left:50%;top:54px;transform:translateX(-50%);
  width:20px;height:7px;
  background:linear-gradient(180deg,#1D2127,#111317);
  border:1px solid rgba(255,255,255,.07);
  border-radius:0 0 4px 4px;
  box-shadow:0 2px 4px rgba(0,0,0,.8);
}

/* ── chassis / torso ─────────────────────────────────────────────── */
.bot-body{
  position:absolute;left:50%;top:60px;transform:translateX(-50%);
  width:54px;height:44px;
  border-radius:12px 12px 10px 10px;
  background:linear-gradient(168deg,#3E454E 0%,#191C21 40%,#191C21 100%);
  border:1px solid rgba(199,203,209,.24);
  box-shadow:
    0 12px 26px rgba(0,0,0,.8),
    0 1px 0 rgba(255,255,255,.09) inset,
    0 -10px 18px rgba(0,0,0,.55) inset;
}
/* chest plate inset */
.bot-body::before{
  content:'';position:absolute;left:9px;right:9px;top:8px;height:16px;
  border-radius:6px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25));
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
}
/* amber core light behind the chest plate */
.bot-core{
  position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:12px;height:6px;border-radius:6px;
  background:var(--accent);
  box-shadow:0 0 8px rgba(255,187,0,.75),0 0 18px rgba(255,187,0,.3);
  opacity:.9;
  animation:core 3.1s ease-in-out 1.9s infinite;
}
@keyframes core{
  0%,100%{opacity:.9;box-shadow:0 0 8px rgba(255,187,0,.75),0 0 18px rgba(255,187,0,.3)}
  50%    {opacity:.5;box-shadow:0 0 4px rgba(255,187,0,.45),0 0 10px rgba(255,187,0,.15)}
}
/* lower vent slats */
.bot-vent{
  position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
  width:26px;height:6px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px);
}

/* ── arms ────────────────────────────────────────────────────────── */
.bot-arm{
  position:absolute;top:63px;width:8px;height:26px;
  border-radius:4px;
  background:linear-gradient(180deg,#343A42,#111317);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 3px 6px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
  transform-origin:50% 2px;
}
.bot-arm.l{left:5px;animation:armL 4.4s ease-in-out 1.9s infinite}
.bot-arm.r{right:5px;animation:armR 4.4s ease-in-out 1.9s infinite}
@keyframes armL{
  0%,100%{transform:rotate(4deg)}
  50%    {transform:rotate(8deg)}
}
@keyframes armR{
  0%,100%{transform:rotate(-4deg)}
  50%    {transform:rotate(-8deg)}
}

/* ── hover ring / ground light ───────────────────────────────────── */
.bot-ring{
  position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:56px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,187,0,.16),rgba(255,187,0,.04) 55%,transparent 74%);
  border:1px solid rgba(255,187,0,.14);
  animation:ring 4.4s ease-in-out 1.9s infinite;
}
@keyframes ring{
  0%,100%{opacity:.75;transform:translateX(-50%) scaleX(1)}
  50%    {opacity:1;transform:translateX(-50%) scaleX(.94)}
}

/* ══════════ CARD ══════════ */
.card{
  background:
    radial-gradient(130% 76% at 50% -18%,rgba(255,187,0,.09),transparent 60%),
    linear-gradient(180deg,rgba(199,203,209,.06),rgba(199,203,209,.016));
  border:1px solid rgba(199,203,209,.20);
  border-radius:16px;
  padding:26px 22px 22px;
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:
    0 24px 70px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(255,187,0,.12),
    0 0 0 1px rgba(255,187,0,.05);
  position:relative;overflow:hidden;
  animation:cardIn .5s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* thin accent hairline on top edge only */
.card::before{
  content:'';position:absolute;top:0;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.5),transparent);
}
.card-head{margin-bottom:22px}
.card-head h1{
  font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:#F5F5F5;
}
.card-head p{
  margin-top:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);
}

/* fields */
.field{margin-bottom:16px}
.field label{
  display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:#A9AFB7;margin-bottom:7px;
}
.inp{
  position:relative;display:flex;align-items:center;
}
.inp i.lead{
  position:absolute;left:13px;font-size:11.5px;color:#8A9099;
  pointer-events:none;transition:color .2s;
}
.inp input{
  width:100%;padding:12px 42px 12px 36px;
  background:rgba(199,203,209,.035);
  border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;
  outline:none;transition:border-color .2s,background .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.inp input::placeholder{color:#8A9099}
.inp input:focus{
  border-color:rgba(255,187,0,.42);
  background:rgba(255,187,0,.028);
  box-shadow:0 0 0 3px rgba(255,187,0,.07);
}
.inp:focus-within i.lead{color:var(--accent)}
.inp input:focus + .eye,
.inp input:focus ~ .eye{color:var(--accent)}
.eye{
  position:absolute;right:6px;background:none;border:none;cursor:pointer;
  color:#8A9099;font-size:11.5px;padding:8px 9px;border-radius:7px;
  transition:color .18s;
}
.eye:hover{color:#BAC0C8}

/* remember row */
.row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:2px 0 20px;
}
.check{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#BAC0C8;user-select:none;
}
.check input{position:absolute;opacity:0;width:0;height:0}
.box{
  width:14px;height:14px;border-radius:4px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.02);
  display:grid;place-items:center;transition:border-color .18s,background .18s;
  flex-shrink:0;
}
.box i{font-size:7.5px;color:#0B0D10;opacity:0;transition:opacity .15s}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box i{opacity:1}
.check input:focus-visible + .box{box-shadow:0 0 0 3px rgba(255,187,0,.16)}
.row a{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:#A9AFB7;text-decoration:none;transition:color .18s;
}
.row a:hover{color:var(--accent)}

/* primary button — outline style, accent used sparingly */
.btn{
  width:100%;padding:13px;border-radius:10px;cursor:pointer;
  font-family:var(--ui);font-size:11.5px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
  color:#08090B;
  background:linear-gradient(180deg,#FFCE47,#FFBB00);
  border:1px solid rgba(255,206,71,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(255,187,0,.26);
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:background .2s,border-color .2s,transform .12s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:linear-gradient(180deg,#FFDC7A,#FFC31F);border-color:rgba(255,220,122,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 30px rgba(255,187,0,.4)}
.btn:active{transform:scale(.988)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn i{font-size:11px;color:#08090B}

/* footer switch */
.switch{
  margin-top:18px;padding-top:17px;border-top:1px solid var(--line);
  text-align:center;font-size:11.5px;color:#A9AFB7;
}
.switch a{
  color:var(--accent);text-decoration:none;font-weight:500;
  margin-left:5px;transition:opacity .18s;
}
.switch a:hover{opacity:.8}

/* toast */
.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));
  transform:translate(-50%,-140%);z-index:99;
  max-width:min(340px,calc(100vw - 32px));
  background:#15181D;border:1px solid var(--line-2);border-radius:11px;
  padding:11px 14px;display:flex;align-items:flex-start;gap:9px;
  box-shadow:0 16px 46px rgba(0,0,0,.85);
  transition:transform .34s cubic-bezier(.3,1.3,.5,1),opacity .25s;
  opacity:0;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast i{font-size:11px;margin-top:2px;flex-shrink:0}
.toast.ok i{color:var(--ok)}
.toast.err i{color:var(--danger)}
.toast span{font-size:11.5px;line-height:1.5;color:#DFE2E7}

/* invalid shake */
.shake{animation:shake .4s ease both}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  22%{transform:translateX(-7px)}
  44%{transform:translateX(7px)}
  66%{transform:translateX(-4px)}
  88%{transform:translateX(4px)}
}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{
  position:relative;z-index:2;margin-top:24px;text-align:center;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#8A9099;
}
.foot a{color:#A2A9B1;text-decoration:none}
.foot a:hover{color:var(--accent)}

@media (max-width:360px){
  .card{padding:22px 17px 18px}
  .stage{height:96px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001s!important;animation-iteration-count:1!important;
    transition-duration:.001s!important;
  }
  .bot{transform:none;opacity:1}
}

/* Professional signature finish: precise hierarchy, architectural edges, restrained light */
:root{--gold-metal:#D4AF37;--gold-light:#FFD700;--gold-warm:#FFC94A;--gold-deep:#8F6500;--glass-black:rgba(12,12,11,.91);--silver-line:rgba(255,255,255,.075)}
body{letter-spacing:.005em}
.wrap,.shell{isolation:isolate}
/* etched gold grid becomes a quiet geometric signature */
body::before{background-image:linear-gradient(rgba(212,175,55,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.06) 1px,transparent 1px)!important;background-size:56px 56px!important;opacity:.13!important;mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important}
/* Fine double-edge glass, warm internal reflection and deep but clean lift */
.card,.identity,.modal-card{position:relative;border-radius:15px!important;background:linear-gradient(138deg,rgba(28,27,23,.94) 0%,rgba(17,17,16,.96) 42%,rgba(9,9,9,.96) 100%)!important;border:1px solid rgba(212,175,55,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.085),inset 1px 0 0 rgba(255,255,255,.018),inset 0 -1px 0 rgba(212,175,55,.055),0 16px 42px rgba(0,0,0,.48),0 3px 9px rgba(0,0,0,.36)!important;transition:border-color .24s ease,box-shadow .24s ease,transform .24s ease!important}
.card::after,.identity::after{content:'';position:absolute;pointer-events:none;inset:1px;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 23%,transparent 74%,rgba(212,175,55,.025));opacity:.8}
.card:hover,.identity:hover{border-color:rgba(255,201,74,.34)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 20px 48px rgba(0,0,0,.56),0 0 22px rgba(212,175,55,.055)!important;transform:translateY(-1px)}
.card-title{font-size:10px!important;letter-spacing:.18em!important;color:#E9E5D8!important}
.card-title i,.head h1 i{color:#D4AF37!important;text-shadow:0 0 8px rgba(212,175,55,.24)}
.head h1{letter-spacing:-.025em;text-shadow:0 2px 18px rgba(255,255,255,.045)}
.head p,.desc,.card-sub{color:#A7A7A3!important}
/* gold marker rule gives each content header a deliberate editorial anchor */
.head h1{position:relative}
.head h1::after{content:'';display:block;width:38px;height:2px;margin-top:9px;border-radius:2px;background:linear-gradient(90deg,#FFD700,#D4AF37 60%,transparent);box-shadow:0 0 8px rgba(212,175,55,.22)}
.appbar,.nav{border-color:rgba(212,175,55,.20)!important;box-shadow:0 10px 28px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.045)!important}
.brand{letter-spacing:.015em}.brand b{color:#F3F1E9!important}.brand small{color:#8F8F89!important;letter-spacing:.09em}
.top-brand .brand-mark,.mark img{filter:drop-shadow(0 1px 1px rgba(255,255,255,.27)) drop-shadow(0 0 6px rgba(255,215,0,.36)) drop-shadow(0 0 15px rgba(212,175,55,.16))!important}
/* beveled gold controls; restrained light only on interaction */
.btn{border-radius:10px!important;letter-spacing:.025em;min-height:40px}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#FFE58A 0%,#E2BD4A 27%,#C59B27 70%,#8F6500 100%)!important;border-color:rgba(255,215,0,.63)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(75,52,0,.32),0 5px 15px rgba(0,0,0,.26),0 0 10px rgba(212,175,55,.13)!important}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.68),0 7px 19px rgba(0,0,0,.32),0 0 16px rgba(255,201,74,.24)!important}
.btn:not(:disabled):active{transform:translateY(0) scale(.99)}
.btn.ghost,.top-link,.link,.logout{border-radius:9px!important;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(12,12,12,.38))!important;border-color:rgba(212,175,55,.25)!important}
input,select,textarea,.inp{border-radius:10px!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.32)!important}
input:focus,select:focus,textarea:focus,.inp:focus-within{border-color:rgba(255,215,0,.66)!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px rgba(212,175,55,.14),0 0 15px rgba(255,201,74,.10)!important}
:focus-visible{outline:2px solid rgba(255,215,0,.68)!important;outline-offset:3px}
/* polished icon tokens and clear active navigation */
.nav a i{color:rgba(212,175,55,.68)!important;transition:color .2s ease,filter .2s ease,transform .2s ease}
.nav a:hover i{color:#FFC94A!important;filter:drop-shadow(0 0 5px rgba(255,201,74,.3));transform:translateY(-1px)}
.nav a.active i{color:#FFD700!important;filter:drop-shadow(0 0 7px rgba(255,215,0,.42))!important}
.nav a.active span{color:#F5D76E!important}
.nav a.active::after{height:2px!important;box-shadow:0 0 9px rgba(255,215,0,.45)!important}
/* quiet holographic sheen, one slow sweep rather than constant noisy neon */
@keyframes goldSheen{0%,72%,100%{transform:translateX(-130%) skewX(-15deg);opacity:0}78%{opacity:.5}92%{transform:translateX(230%) skewX(-15deg);opacity:0}}
.logo-mark,.ring-glow{will-change:opacity}
.top-brand .brand-mark{animation:brandGlow 6s ease-in-out infinite}
@keyframes brandGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(212,175,55,.22))}50%{filter:drop-shadow(0 0 8px rgba(255,215,0,.4))}}
.bot-head,.bot-body{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -8px 16px rgba(0,0,0,.42),0 10px 22px rgba(0,0,0,.4),0 0 12px rgba(212,175,55,.08)!important}
.bot-visor{border-color:rgba(255,215,0,.38)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 13px rgba(212,175,55,.12)!important}
/* screens with data collections remain comfortable on narrow mobile */
@media(max-width:480px){.card,.identity{border-radius:13px!important}.card-title{letter-spacing:.14em!important}.nav a i{font-size:14px}.btn{min-height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001s!important}.card:hover,.identity:hover,.btn:not(:disabled):hover{transform:none}}

</style>
</head>

<main class="shell">
  <div class="stage" aria-hidden="true">
    <div class="bot" id="bot">
      <div class="bot-float">
        <div class="bot-head">
          <span class="bot-antenna"></span>
          <span class="bot-bead"></span>
          <span class="bot-ear l"></span>
          <span class="bot-ear r"></span>
          <div class="bot-visor">
            <span class="bot-eye l"></span>
            <span class="bot-eye r"></span>
          </div>
        </div>
        <div class="bot-neck"></div>
        <div class="bot-body">
          <span class="bot-core"></span>
          <span class="bot-vent"></span>
        </div>
        <div class="bot-arm l"></div>
        <div class="bot-arm r"></div>
      </div>
      <div class="bot-ring"></div>
    </div>

  <section class="card" id="card">
    <div class="card-head">
      <h1>Authentication</h1>
      <p>Enter your credentials to continue</p>
    </div>

    <form id="form" novalidate autocomplete="on">
      <div class="field">
        <label for="user">Username or email</label>
        <div class="inp">
          <i class="fa-regular fa-user lead"></i>
          <input type="text" id="user" name="username" placeholder="username" autocomplete="username" autocapitalize="none" spellcheck="false"/>
        </div>
      </div>

      <div class="field">
        <label for="pass">Password</label>
        <div class="inp">
          <i class="fa-solid fa-lock lead"></i>
          <input type="password" id="pass" name="password" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="eye" id="eye" aria-label="Show password">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" checked/>
          <span class="box"><i class="fa-solid fa-check"></i></span>
          Remember me
        </label>
        <a href="https://t.me/S7xShamrez" target="_blank" rel="noopener">Forgot?</a>
      </div>

      <button type="submit" class="btn" id="submit">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Sign in</span>
      </button>
    </form>

    <div class="switch">
      No account?<a href="/register.html">Create one</a>
    </div>
  </section>

  <div class="foot">
    <a href="https://t.me/Shamrezmainchannel" target="_blank" rel="noopener">Get Premium Access</a>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-info" id="toastIcon"></i>
  <span id="toastText"></span>
</div>

<script>
(function(){
  var bot       = document.getElementById('bot');
  var card      = document.getElementById('card');
  var form      = document.getElementById('form');
  var userInp   = document.getElementById('user');
  var passInp   = document.getElementById('pass');
  var submitBtn = document.getElementById('submit');
  var toast     = document.getElementById('toast');

  /* boot the robot, then let it settle beside the form */
  requestAnimationFrame(function(){
    bot.classList.add('enter');
  });

  /* already authenticated? skip straight in */
  fetch('/api/session', { credentials: 'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.loggedIn) location.replace('/pair.html');
    })
    .catch(function(){});

  /* password visibility */
  var eye = document.getElementById('eye');
  var eyeIcon = document.getElementById('eyeIcon');
  eye.addEventListener('click', function(){
    var showing = passInp.type === 'text';
    passInp.type = showing ? 'password' : 'text';
    eyeIcon.className = showing ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    eye.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  /* toast helper */
  var toastTimer;
  function showToast(msg, type){
    document.getElementById('toastText').textContent = msg;
    var icon = document.getElementById('toastIcon');
    toast.className = 'toast ' + (type === 'ok' ? 'ok' : 'err');
    icon.className = 'fa-solid ' + (type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation');
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3800);
  }

  function shake(){
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }

  /* submit */
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var u = userInp.value.trim();
    var p = passInp.value;

    if (!u || !p){
      shake();
      showToast(!u ? 'Enter your username or email.' : 'Enter your password.');
      (!u ? userInp : passInp).focus();
      return;
    }

    submitBtn.disabled = true;
    var label = submitBtn.querySelector('span');
    var prev  = label.textContent;
    label.textContent = 'Verifying';
    var ico = submitBtn.querySelector('i');
    var prevIco = ico.className;
    ico.className = 'fa-solid fa-circle-notch spin';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: u,
        password: p,
        remember: document.getElementById('remember').checked
      })
    })
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (res.body && res.body.ok){
        label.textContent = 'Granted';
        ico.className = 'fa-solid fa-check';
        showToast('Welcome back.', 'ok');
        setTimeout(function(){ location.replace('/pair.html'); }, 520);
        return;
      }
      throw new Error((res.body && res.body.error) || 'Sign in failed.');
    })
    .catch(function(err){
      submitBtn.disabled = false;
      label.textContent = prev;
      ico.className = prevIco;
      shake();
      showToast(err.message || 'Network error. Try again.');
    });
  });

  /* prefill remembered username (never the password) */
  try {
    var saved = localStorage.getItem('cipher_last_user');
    if (saved) userInp.value = saved;
  } catch(e){}
  userInp.addEventListener('input', function(){
    try { localStorage.setItem('cipher_last_user', userInp.value.trim()); } catch(e){}
  });
}());
</script>
