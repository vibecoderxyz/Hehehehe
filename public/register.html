<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090B; --surface:#111317; --raise:#191C21; --panel:#15181D;
  --line:rgba(199,203,209,.17); --line-2:rgba(199,203,209,.30);
  --accent:#FFBB00; --accent-hi:#FFCE47; --accent-soft:rgba(255,206,71,.6);
  --accent-faint:rgba(255,187,0,.10);
  --text:#F5F5F5; --muted:#C7CBD1; --dim:#8A9099;
  --danger:#FFBB00; --ok:#FFCE47;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
  --pad:18px;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:calc(70px + env(safe-area-inset-top)) var(--pad)
                    calc(30px + env(safe-area-inset-bottom));
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 72%);
  opacity:.5;
}
/* ambient depth — faint amber pool top and bottom plus a soft vignette */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(122% 46% at 50% -10%,rgba(255,187,0,.15),transparent 64%),
    radial-gradient(90% 58% at 50% 108%,rgba(255,206,71,.07),transparent 68%),
    radial-gradient(circle at 50% 42%,transparent 30%,rgba(0,0,0,.6) 82%);
}

.top{
  position:absolute;top:0;left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) var(--pad) 0;
}
.top-brand{display:flex;align-items:center;gap:9px}
.top-brand .brand-mark{width:20px;height:20px;object-fit:contain;flex-shrink:0;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.top-brand span{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#BAC0C8}
.top-link{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#BAC0C8;text-decoration:none;padding:7px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:rgba(199,203,209,.04);
  transition:color .18s,border-color .18s,background .18s;
}
.top-link:hover{color:var(--accent-hi);border-color:rgba(255,187,0,.34);background:rgba(255,187,0,.07)}

.shell{position:relative;z-index:2;width:100%;max-width:394px;display:flex;flex-direction:column;gap:18px;margin:auto 0}

/* ── small machined robot ── */
.stage{position:relative;z-index:2;height:126px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.bot{position:relative;width:100px;height:108px;transform:translateY(16px) scale(.94);transform-origin:50% 50%;opacity:0}
.bot.enter{animation:botGoldEntrance .82s cubic-bezier(.2,.82,.24,1) .05s forwards}
.bot-float{position:absolute;inset:0;animation:hover 4.4s ease-in-out 1.9s infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}

.bot-head{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:64px;height:54px;border-radius:18px 18px 14px 14px;
  background:linear-gradient(180deg,#4A525C 0%,#2A2F36 18%,#191C21 62%,#111317 100%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 24px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.10) inset,0 -8px 16px rgba(0,0,0,.5) inset;
}
.bot-head::before{
  content:'';position:absolute;left:8px;right:8px;top:5px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
}
.bot-head::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:7px;width:20px;height:2px;border-radius:2px;
  background:rgba(0,0,0,.75);box-shadow:0 1px 0 rgba(255,255,255,.07);
}
.bot-antenna{position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:2px;height:11px;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.06))}
.bot-bead{
  position:absolute;left:50%;top:-16px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 6px rgba(255,187,0,.85),0 0 14px rgba(255,187,0,.35);
  animation:bead 2.6s ease-in-out 1.9s infinite;
}
@keyframes bead{
  0%,100%{opacity:1;box-shadow:0 0 6px rgba(255,187,0,.85),0 0 14px rgba(255,187,0,.35)}
  50%{opacity:.45;box-shadow:0 0 3px rgba(255,187,0,.5),0 0 8px rgba(255,187,0,.18)}
}
.bot-ear{position:absolute;top:20px;width:5px;height:16px;border-radius:2px;background:linear-gradient(180deg,#343A42,#15181D);border:1px solid rgba(255,255,255,.09);box-shadow:0 1px 2px rgba(0,0,0,.7)}
.bot-ear.l{left:-6px}
.bot-ear.r{right:-6px}

.bot-visor{
  position:absolute;left:50%;top:15px;transform:translateX(-50%);
  width:46px;height:23px;border-radius:11px;
  background:linear-gradient(168deg,#0B0D10 0%,#111317 45%,#0B0D10 100%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
.bot-visor::before{
  content:'';position:absolute;left:-30%;top:-60%;width:70%;height:180%;
  background:linear-gradient(102deg,transparent,rgba(255,255,255,.16),transparent);
  transform:rotate(8deg);animation:glint 6.5s ease-in-out 1.9s infinite;
}
@keyframes glint{0%,72%,100%{transform:translateX(-40%) rotate(8deg)}84%{transform:translateX(210%) rotate(8deg)}}
.bot-visor::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 120%,rgba(255,187,0,.10),transparent 62%)}

.bot-eye{
  position:absolute;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFEEBE 0%,var(--accent) 42%,#8A6500 100%);
  box-shadow:0 0 5px rgba(255,187,0,.9),0 0 12px rgba(255,187,0,.45),0 0 22px rgba(255,187,0,.18);
  animation:scan 5.2s ease-in-out 1.9s infinite;
}
.bot-eye.l{left:10px}
.bot-eye.r{right:10px;animation-delay:3.6s}
@keyframes scan{0%,88%,100%{transform:translateY(-50%) scaleY(1);opacity:1}93%{transform:translateY(-50%) scaleY(.12);opacity:.65}}

.bot-neck{
  position:absolute;left:50%;top:52px;transform:translateX(-50%);
  width:20px;height:7px;background:linear-gradient(180deg,#1D2127,#111317);
  border:1px solid rgba(255,255,255,.07);border-radius:0 0 4px 4px;
  box-shadow:0 2px 4px rgba(0,0,0,.8);
}
.bot-body{
  position:absolute;left:50%;top:58px;transform:translateX(-50%);
  width:52px;height:42px;border-radius:12px 12px 10px 10px;
  background:linear-gradient(168deg,#3E454E 0%,#191C21 40%,#191C21 100%);
  border:1px solid rgba(199,203,209,.24);
  box-shadow:0 12px 26px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.09) inset,0 -10px 18px rgba(0,0,0,.55) inset;
}
.bot-body::before{
  content:'';position:absolute;left:9px;right:9px;top:8px;height:15px;border-radius:6px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25));
  border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 1px 3px rgba(0,0,0,.8);
}
.bot-core{
  position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:12px;height:6px;border-radius:6px;background:var(--accent);
  box-shadow:0 0 8px rgba(255,187,0,.75),0 0 18px rgba(255,187,0,.3);
  animation:core 3.1s ease-in-out 1.9s infinite;
}
@keyframes core{
  0%,100%{opacity:.9;box-shadow:0 0 8px rgba(255,187,0,.75),0 0 18px rgba(255,187,0,.3)}
  50%{opacity:.5;box-shadow:0 0 4px rgba(255,187,0,.45),0 0 10px rgba(255,187,0,.15)}
}
.bot-vent{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:26px;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px)}

.bot-arm{
  position:absolute;top:61px;width:8px;height:25px;border-radius:4px;
  background:linear-gradient(180deg,#343A42,#111317);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 3px 6px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
  transform-origin:50% 2px;
}
.bot-arm.l{left:4px;animation:armL 4.4s ease-in-out 1.9s infinite}
.bot-arm.r{right:4px;animation:armR 4.4s ease-in-out 1.9s infinite}
@keyframes armL{0%,100%{transform:rotate(4deg)}50%{transform:rotate(8deg)}}
@keyframes armR{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-8deg)}}

.bot-ring{
  position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:54px;height:9px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,187,0,.16),rgba(255,187,0,.04) 55%,transparent 74%);
  border:1px solid rgba(255,187,0,.14);
  animation:ring 4.4s ease-in-out 1.9s infinite;
}
@keyframes ring{0%,100%{opacity:.75;transform:translateX(-50%) scaleX(1)}50%{opacity:1;transform:translateX(-50%) scaleX(.94)}}

/* ── card ── */
.card{
  background:
    radial-gradient(130% 76% at 50% -18%,rgba(255,187,0,.09),transparent 60%),
    linear-gradient(180deg,rgba(199,203,209,.06),rgba(199,203,209,.016));
  border:1px solid rgba(199,203,209,.20);border-radius:17px;padding:24px 22px 20px;
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:
    0 24px 66px rgba(0,0,0,.72),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(255,187,0,.12),
    0 0 0 1px rgba(255,187,0,.05);
  position:relative;overflow:hidden;
  animation:cardIn .5s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card::before{
  content:'';position:absolute;top:0;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.45),transparent);
}
.card-head{margin-bottom:20px}
.card-head h1{font-size:17.5px;font-weight:600;letter-spacing:.02em;color:#F5F5F5}
.card-head p{margin-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#A9AFB7}

.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#A9AFB7;margin-bottom:7px}
.inp{position:relative;display:flex;align-items:center}
.inp i.lead{position:absolute;left:13px;font-size:11.5px;color:#8A9099;pointer-events:none;transition:color .18s}
.inp input{
  width:100%;padding:12px 42px 12px 36px;
  background:rgba(199,203,209,.035);
  border:1px solid var(--line);border-radius:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  color:var(--text);font-family:var(--mono);font-size:12.5px;
  outline:none;transition:border-color .18s,background .18s,box-shadow .18s;
  -webkit-appearance:none;
}
.inp input::placeholder{color:#8A9099}
.inp input:focus{
  border-color:rgba(255,187,0,.46);
  background:rgba(255,187,0,.026);
  box-shadow:0 0 0 3px rgba(255,187,0,.08);
}
.inp input:focus-visible{outline:1px solid rgba(255,187,0,.45);outline-offset:1px}
.inp:focus-within i.lead{color:var(--accent-hi)}
.eye{position:absolute;right:6px;background:none;border:none;cursor:pointer;color:#8A9099;font-size:11.5px;padding:8px 9px;border-radius:7px;transition:color .18s}
.eye:hover{color:#BAC0C8}

/* strength meter */
.meter{margin-top:8px;display:flex;gap:4px}
.meter i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .25s}
.meter i.on-1{background:#FFBB00}
.meter i.on-2{background:#FFCE47}
.meter i.on-3{background:var(--ok)}
.hint{
  margin-top:6px;font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:#8A9099;min-height:11px;
}

.terms{
  display:flex;align-items:flex-start;gap:8px;margin:4px 0 18px;
  font-size:11px;line-height:1.55;color:#A9AFB7;cursor:pointer;
}
.terms input{position:absolute;opacity:0;width:0;height:0}
.terms .box{
  width:14px;height:14px;border-radius:4px;margin-top:1px;
  border:1px solid var(--line-2);background:rgba(199,203,209,.04);
  display:grid;place-items:center;transition:border-color .18s,background .18s;flex-shrink:0;
}
.terms .box i{font-size:7.5px;color:#0B0D10;opacity:0;transition:opacity .15s}
.terms input:checked + .box{background:var(--accent);border-color:var(--accent)}
.terms input:checked + .box i{opacity:1}
.terms input:focus-visible + .box{outline:1px solid rgba(255,187,0,.55);outline-offset:2px}
.terms a{color:var(--accent-hi);text-decoration:none}
.terms a:hover{opacity:.8}

.btn{
  width:100%;padding:13px;border-radius:11px;cursor:pointer;
  font-family:var(--ui);font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:#08090B;
  background:linear-gradient(180deg,#FFCE47,#FFBB00);
  border:1px solid rgba(255,206,71,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(255,187,0,.28);
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:background .18s,border-color .18s,transform .1s,box-shadow .18s;
  -webkit-appearance:none;
}
.btn:hover:not(:disabled){
  background:linear-gradient(180deg,#FFDC7A,#FFC31F);
  border-color:rgba(255,220,122,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 28px rgba(255,187,0,.4);
}
.btn:active:not(:disabled){transform:scale(.988)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:1px solid rgba(255,187,0,.5);outline-offset:2px}
.btn i{font-size:11px;color:#08090B}

.switch{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:#A9AFB7}
.switch a{color:var(--accent-hi);text-decoration:none;font-weight:500;margin-left:5px}
.switch a:hover{opacity:.8}

.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));
  transform:translate(-50%,-140%);z-index:99;
  max-width:min(340px,calc(100vw - 32px));
  background:#1B1F25;border:1px solid var(--line-2);border-radius:12px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:9px;
  box-shadow:0 18px 48px rgba(0,0,0,.88);
  transition:transform .34s cubic-bezier(.3,1.3,.5,1),opacity .25s;opacity:0;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast i{font-size:11px;margin-top:2px;flex-shrink:0}
.toast.ok i{color:var(--ok)}
.toast.err i{color:var(--danger)}
.toast span{font-size:11.5px;line-height:1.5;color:#E2E5E9}

.shake{animation:shake .4s ease both}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}44%{transform:translateX(7px)}66%{transform:translateX(-4px)}88%{transform:translateX(4px)}}
.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* success overlay showing assigned UID */
.modal{
  position:fixed;inset:0;z-index:80;display:none;
  place-items:center;padding:24px;
  background:rgba(4,4,4,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.modal.show{display:grid;animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  width:100%;max-width:330px;text-align:center;
  background:
    radial-gradient(120% 70% at 50% -12%,rgba(255,187,0,.18),transparent 62%),
    linear-gradient(180deg,#1D2127,#111317);
  border:1px solid rgba(255,206,71,.28);border-radius:18px;
  padding:27px 22px;
  box-shadow:
    0 28px 80px rgba(0,0,0,.92),
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 0 1px rgba(255,187,0,.06);
  position:relative;overflow:hidden;
}
.modal-card::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.6),transparent);
}
.modal-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:130px;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(255,187,0,.09),transparent 68%);
}
.modal-card .tick{
  width:44px;height:44px;border-radius:50%;margin:0 auto 14px;
  display:grid;place-items:center;color:var(--accent-hi);font-size:16px;
  background:linear-gradient(180deg,rgba(255,187,0,.14),rgba(255,187,0,.05));
  border:1px solid rgba(255,187,0,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(255,187,0,.12);
  position:relative;z-index:1;
}
.modal-card h2{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#F5F5F5;position:relative;z-index:1}
.modal-card p{margin-top:8px;font-size:11px;line-height:1.6;color:#BAC0C8;position:relative;z-index:1}
.uid{
  margin:16px 0 6px;padding:15px;border-radius:12px;position:relative;z-index:1;
  background:
    radial-gradient(120% 95% at 50% -4%,rgba(255,187,0,.20),transparent 70%),
    linear-gradient(180deg,rgba(255,206,71,.10),rgba(255,187,0,.03));
  border:1px solid rgba(255,206,71,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 0 26px rgba(255,187,0,.10);
}
.uid small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#B09A5C;margin-bottom:7px}
.uid strong{
  font-family:var(--mono);font-size:26px;font-weight:500;
  letter-spacing:.18em;color:var(--accent-hi);text-shadow:0 0 24px rgba(255,187,0,.3);
}
.uid em{display:block;margin-top:8px;font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#A2A9B1}
.modal-card .btn{margin-top:17px;position:relative;z-index:1}

.foot{position:relative;z-index:2;margin-top:18px;text-align:center;font-family:var(--mono);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#8A9099}
.foot a{color:#A2A9B1;text-decoration:none}
.foot a:hover{color:var(--accent-hi)}

@media (max-width:360px){:root{--pad:14px} .card{padding:21px 17px 17px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .bot{transform:none;opacity:1}
}


/* CIPHER BVG luxury brief: matte-black foundation, controlled metallic-gold accents */
:root{--bg:#050505;--surface:#0A0A0A;--raise:#101010;--panel:#141414;--accent:#D4AF37;--accent-hi:#FFD700;--accent-dim:rgba(212,175,55,.42);--accent-soft:rgba(245,215,110,.56);--accent-faint:rgba(212,175,55,.075);--line:rgba(197,197,197,.105);--line-2:rgba(212,175,55,.22);--text:#FFFFFF;--muted:#C5C5C5;--dim:#888888;--danger:#A67C00;--ok:#F5D76E}
html,body{background-color:#050505;color:#FFFFFF}
body{background-image:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.055),transparent 39%),linear-gradient(180deg,#050505,#080808 64%,#050505)!important}
body::before{opacity:.15!important}
body::after{background:radial-gradient(ellipse 70% 34% at 50% -5%,rgba(245,215,110,.075),transparent 72%),radial-gradient(ellipse 65% 32% at 50% 108%,rgba(166,124,0,.035),transparent 76%),radial-gradient(ellipse at 50% 45%,transparent 48%,rgba(0,0,0,.38) 100%)!important}
.card,.identity,.modal-card,.splash::before{background:linear-gradient(145deg,rgba(24,24,24,.84),rgba(13,13,13,.91) 58%,rgba(10,10,10,.94))!important;border:1px solid rgba(212,175,55,.19)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(212,175,55,.035),0 18px 48px rgba(0,0,0,.58),0 0 20px rgba(212,175,55,.035)!important;backdrop-filter:blur(14px) saturate(112%);-webkit-backdrop-filter:blur(14px) saturate(112%)}
.card::before,.identity::before,.modal-card::before{background:linear-gradient(90deg,transparent,rgba(245,215,110,.46),transparent)!important;opacity:.75}
.appbar,.nav{background:linear-gradient(180deg,rgba(14,14,14,.94),rgba(7,7,7,.91))!important;border-color:rgba(212,175,55,.18)!important;box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 16px rgba(212,175,55,.025)!important;backdrop-filter:blur(18px) saturate(115%);-webkit-backdrop-filter:blur(18px) saturate(115%)}
.top-link,.btn.ghost,.link,.logout{background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(10,10,10,.28))!important;border-color:rgba(212,175,55,.30)!important;color:#C5C5C5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)!important}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#F5D76E 0%,#D4AF37 55%,#A67C00 100%)!important;border-color:rgba(255,215,0,.72)!important;color:#101010!important;text-shadow:0 1px rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -2px 0 rgba(89,64,0,.26),0 0 10px rgba(212,175,55,.14),0 7px 20px rgba(0,0,0,.24)!important}
.btn:not(:disabled):hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.56),0 0 15px rgba(245,215,110,.22),0 10px 24px rgba(0,0,0,.32)!important}
input,select,textarea,.inp{background:linear-gradient(140deg,rgba(255,255,255,.035),rgba(10,10,10,.18))!important;border-color:rgba(197,197,197,.15)!important;color:#FFFFFF!important}
input::placeholder,textarea::placeholder{color:#888888!important}
input:focus,select:focus,textarea:focus,.inp:focus-within{border-color:rgba(255,215,0,.55)!important;box-shadow:0 0 0 1px rgba(212,175,55,.12),0 0 15px rgba(212,175,55,.06)!important}
.card-title i,.head i,.nav a.active,.nav a.active i,.tag.gold,.badge,.chip.ok,.chip.warn{color:#FFD700!important}
.card-title,.head h1,.card-head h1{color:#FFFFFF}
.mark img,.brand-mark,#logo{filter:drop-shadow(0 1px 1px rgba(255,255,255,.2)) drop-shadow(0 0 5px rgba(212,175,55,.24))!important}
.mark{border-color:rgba(212,175,55,.28)!important;box-shadow:inset 0 0 10px rgba(212,175,55,.04),0 0 10px rgba(212,175,55,.045)!important}
.cmd,.term,.log,.cmd-list,.code-box,.code,.uid,.sess-row{background-color:rgba(5,5,5,.72)!important;border-color:rgba(212,175,55,.16)!important}
.chip,.tag,.badge{border-color:rgba(212,175,55,.24)!important}
.toast,.modal-card{background-color:rgba(10,10,10,.95)!important}
.bot-head,.bot-body{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -8px 16px rgba(0,0,0,.42),0 9px 22px rgba(0,0,0,.4),0 0 10px rgba(212,175,55,.055)!important}
.bot-ring{filter:drop-shadow(0 0 5px rgba(212,175,55,.22))!important}
.ring{border-color:rgba(212,175,55,.38)!important;box-shadow:0 0 20px rgba(212,175,55,.10),inset 0 1px 2px rgba(255,255,255,.10),inset 0 -12px 22px rgba(0,0,0,.5)!important}
::selection{background:rgba(212,175,55,.30);color:#FFFFFF}
@media(prefers-reduced-motion:reduce){.bot.enter{animation-duration:.001s!important}}


/* Original robot, subtle non-rotating arrival */
.bot.enter{animation:botGoldEntrance .82s cubic-bezier(.2,.82,.24,1) .05s forwards!important}
@keyframes botGoldEntrance{0%{transform:perspective(700px) translateY(34px) scale(.88);opacity:0}72%{transform:perspective(700px) translateY(-3px) scale(1.015);opacity:1}100%{transform:perspective(700px) translateY(0) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.bot.enter{animation-duration:.001s!important}}

/* Professional signature finish: precise hierarchy, architectural edges, restrained light */
:root{--gold-metal:#D4AF37;--gold-light:#FFD700;--gold-warm:#FFC94A;--gold-deep:#8F6500;--glass-black:rgba(12,12,11,.91);--silver-line:rgba(255,255,255,.075)}
body{letter-spacing:.005em}
.wrap,.shell{isolation:isolate}
/* etched gold grid becomes a quiet geometric signature */
body::before{background-image:linear-gradient(rgba(212,175,55,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.06) 1px,transparent 1px)!important;background-size:56px 56px!important;opacity:.13!important;mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important}
/* Fine double-edge glass, warm internal reflection and deep but clean lift */
.card,.identity,.modal-card{position:relative;border-radius:15px!important;background:linear-gradient(138deg,rgba(28,27,23,.94) 0%,rgba(17,17,16,.96) 42%,rgba(9,9,9,.96) 100%)!important;border:1px solid rgba(212,175,55,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.085),inset 1px 0 0 rgba(255,255,255,.018),inset 0 -1px 0 rgba(212,175,55,.055),0 16px 42px rgba(0,0,0,.48),0 3px 9px rgba(0,0,0,.36)!important;transition:border-color .24s ease,box-shadow .24s ease,transform .24s ease!important}
.card::after,.identity::after{content:'';position:absolute;pointer-events:none;inset:1px;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 23%,transparent 74%,rgba(212,175,55,.025));opacity:.8}
.card:hover,.identity:hover{border-color:rgba(255,201,74,.34)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 20px 48px rgba(0,0,0,.56),0 0 22px rgba(212,175,55,.055)!important;transform:translateY(-1px)}
.card-title{font-size:10px!important;letter-spacing:.18em!important;color:#E9E5D8!important}
.card-title i,.head h1 i{color:#D4AF37!important;text-shadow:0 0 8px rgba(212,175,55,.24)}
.head h1{letter-spacing:-.025em;text-shadow:0 2px 18px rgba(255,255,255,.045)}
.head p,.desc,.card-sub{color:#A7A7A3!important}
/* gold marker rule gives each content header a deliberate editorial anchor */
.head h1{position:relative}
.head h1::after{content:'';display:block;width:38px;height:2px;margin-top:9px;border-radius:2px;background:linear-gradient(90deg,#FFD700,#D4AF37 60%,transparent);box-shadow:0 0 8px rgba(212,175,55,.22)}
.appbar,.nav{border-color:rgba(212,175,55,.20)!important;box-shadow:0 10px 28px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.045)!important}
.brand{letter-spacing:.015em}.brand b{color:#F3F1E9!important}.brand small{color:#8F8F89!important;letter-spacing:.09em}
.top-brand .brand-mark,.mark img{filter:drop-shadow(0 1px 1px rgba(255,255,255,.27)) drop-shadow(0 0 6px rgba(255,215,0,.36)) drop-shadow(0 0 15px rgba(212,175,55,.16))!important}
/* beveled gold controls; restrained light only on interaction */
.btn{border-radius:10px!important;letter-spacing:.025em;min-height:40px}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#FFE58A 0%,#E2BD4A 27%,#C59B27 70%,#8F6500 100%)!important;border-color:rgba(255,215,0,.63)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(75,52,0,.32),0 5px 15px rgba(0,0,0,.26),0 0 10px rgba(212,175,55,.13)!important}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.68),0 7px 19px rgba(0,0,0,.32),0 0 16px rgba(255,201,74,.24)!important}
.btn:not(:disabled):active{transform:translateY(0) scale(.99)}
.btn.ghost,.top-link,.link,.logout{border-radius:9px!important;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(12,12,12,.38))!important;border-color:rgba(212,175,55,.25)!important}
input,select,textarea,.inp{border-radius:10px!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.32)!important}
input:focus,select:focus,textarea:focus,.inp:focus-within{border-color:rgba(255,215,0,.66)!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px rgba(212,175,55,.14),0 0 15px rgba(255,201,74,.10)!important}
:focus-visible{outline:2px solid rgba(255,215,0,.68)!important;outline-offset:3px}
/* polished icon tokens and clear active navigation */
.nav a i{color:rgba(212,175,55,.68)!important;transition:color .2s ease,filter .2s ease,transform .2s ease}
.nav a:hover i{color:#FFC94A!important;filter:drop-shadow(0 0 5px rgba(255,201,74,.3));transform:translateY(-1px)}

.nav a.active span{color:#F5D76E!important}

/* quiet holographic sheen, one slow sweep rather than constant noisy neon */
@keyframes goldSheen{0%,72%,100%{transform:translateX(-130%) skewX(-15deg);opacity:0}78%{opacity:.5}92%{transform:translateX(230%) skewX(-15deg);opacity:0}}
.logo-mark,.ring-glow{will-change:opacity}

</style>

<main class="shell">

    <div class="bot" id="bot">

          <span class="bot-bead"></span>
          <span class="bot-ear l"></span>
          <span class="bot-ear r"></span>

            <span class="bot-eye r"></span>
          </div>

      <div class="field">
        <label for="user">Username</label>
        <div class="inp">
          <i class="fa-regular fa-user lead"></i>
          <input type="text" id="user" placeholder="3-20 characters" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"/>
        </div>
      </div>

      <div class="field">
        <label for="pass">Password</label>
        <div class="inp">
          <i class="fa-solid fa-lock lead"></i>
          <input type="password" id="pass" placeholder="min. 6 characters" autocomplete="new-password"/>
          <button type="button" class="eye" id="eye" aria-label="Show password">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div class="meter" id="meter"><i></i><i></i><i></i></div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="field">
        <label for="pass2">Confirm password</label>
        <div class="inp">
          <i class="fa-solid fa-lock lead"></i>
          <input type="password" id="pass2" placeholder="repeat password" autocomplete="new-password"/>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms"/>
        <span class="box"><i class="fa-solid fa-check"></i></span>
        <span>I agree to the <a href="https://t.me/Shamrezmainchannel" target="_blank" rel="noopener">terms of use</a> and understand that access usage is my own responsibility.</span>

        <i class="fa-solid fa-user-plus"></i>
        <span>Register</span>
      </button>

      <em id="unameValue"></em>

      <i class="fa-solid fa-arrow-right"></i><span>Continue</span>
    </button>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-circle-info" id="toastIcon"></i>
  <span id="toastText"></span>
</div>

<script>
(function(){
  var bot = document.getElementById('bot');
  var card = document.getElementById('card');
  var form = document.getElementById('form');
  var userInp = document.getElementById('user');
  var passInp = document.getElementById('pass');
  var pass2Inp = document.getElementById('pass2');
  var terms = document.getElementById('terms');
  var submitBtn = document.getElementById('submit');
  var toast = document.getElementById('toast');

  /* power on, then let the machine idle */
  requestAnimationFrame(function(){
    bot.classList.add('enter');
  });

  /* password visibility */
  var eye = document.getElementById('eye');
  var eyeIcon = document.getElementById('eyeIcon');
  eye.addEventListener('click', function(){
    var showing = passInp.type === 'text';
    passInp.type = pass2Inp.type = showing ? 'password' : 'text';
    eyeIcon.className = showing ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    eye.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  /* strength meter — length + variety, no external libs */
  var meterBars = document.getElementById('meter').children;
  var hint = document.getElementById('hint');
  passInp.addEventListener('input', function(){
    var v = passInp.value;
    var score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;

    var level = v.length === 0 ? 0 : Math.min(3, Math.max(1, score - 1));
    for (var i = 0; i < 3; i++){
      meterBars[i].className = i < level ? 'on-' + level : '';
    }
    hint.textContent = v.length === 0 ? ''
      : level === 1 ? 'weak — add length and mixed characters'
      : level === 2 ? 'acceptable'
      : 'strong';
  });

  var toastTimer;
  function showToast(msg, type){
    document.getElementById('toastText').textContent = msg;
    var icon = document.getElementById('toastIcon');
    toast.className = 'toast ' + (type === 'ok' ? 'ok' : 'err');
    icon.className = 'fa-solid ' + (type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation');
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3800);
  }
  function shake(){
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }

  var createdUid = null;

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var u = userInp.value.trim();
    var p = passInp.value;
    var p2 = pass2Inp.value;

    if (u.length < 3)             { shake(); showToast('Username must be at least 3 characters.'); return userInp.focus(); }
    if (!/^[A-Za-z0-9_.-]+$/.test(u)) { shake(); showToast('Use letters, numbers, dot, dash or underscore only.'); return userInp.focus(); }
    if (p.length < 6)             { shake(); showToast('Password must be at least 6 characters.'); return passInp.focus(); }
    if (p !== p2)                 { shake(); showToast('Passwords do not match.'); return pass2Inp.focus(); }
    if (!terms.checked)           { shake(); showToast('Please accept the terms to continue.'); return; }

    submitBtn.disabled = true;
    var label = submitBtn.querySelector('span');
    var prev = label.textContent;
    var ico = submitBtn.querySelector('i');
    var prevIco = ico.className;
    label.textContent = 'Creating';
    ico.className = 'fa-solid fa-circle-notch spin';

    fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username: u, password: p })
    })
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (res.body && res.body.ok){
        createdUid = String(res.body.uid);
        document.getElementById('uidValue').textContent = createdUid;
        document.getElementById('unameValue').textContent = '@' + (res.body.username || u);
        document.getElementById('modal').classList.add('show');
        return;
      }
      throw new Error((res.body && res.body.error) || 'Registration failed.');
    })
    .catch(function(err){
      submitBtn.disabled = false;
      label.textContent = prev;
      ico.className = prevIco;
      shake();
      showToast(err.message || 'Network error. Try again.');
    });
  });

  document.getElementById('goBtn').addEventListener('click', function(){
    location.replace('/pair.html');
  });
}());
</script>
</body>
</html>
