<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090B; --surface:#111317; --raise:#191C21; --panel:#15181D;
  --line:rgba(199,203,209,.17); --line-2:rgba(199,203,209,.30);
  --accent:#FFBB00; --accent-hi:#FFCE47; --accent-dim:rgba(255,187,0,.45);
  --accent-soft:rgba(255,206,71,.6); --accent-faint:rgba(255,187,0,.10);
  --text:#F5F5F5; --muted:#C7CBD1; --dim:#8A9099;
  --danger:#FFBB00; --ok:#FFCE47;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
  --nav-h:62px; --bar-h:56px; --pad:18px;
}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;min-height:100dvh;
  padding:calc(var(--bar-h) + env(safe-area-inset-top) + 20px) var(--pad)
          calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(circle at 50% 8%,#000 0%,transparent 66%);
  -webkit-mask-image:radial-gradient(circle at 50% 8%,#000 0%,transparent 66%);
  opacity:.5;
}
/* ambient depth — faint amber pool top and bottom plus a soft vignette */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(130% 46% at 50% -10%,rgba(255,187,0,.16),transparent 64%),
    radial-gradient(95% 58% at 50% 108%,rgba(255,206,71,.085),transparent 68%),
    radial-gradient(130% 120% at 50% 42%,transparent 38%,rgba(0,0,0,.62) 100%);
}
.wrap{position:relative;z-index:2;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ══════════ app bar ══════════ */
.appbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(var(--bar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) var(--pad) 0;
  display:flex;align-items:center;gap:12px;
  background:
    radial-gradient(90% 140% at 50% -60%,rgba(255,187,0,.14),transparent 68%),
    linear-gradient(180deg,rgba(25,28,33,.94),rgba(17,19,23,.86));
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid rgba(255,206,71,.20);
  box-shadow:
    0 1px 0 rgba(255,255,255,.03),
    0 0 0 1px rgba(255,187,0,.05),
    0 12px 30px rgba(0,0,0,.42);
}
.appbar::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.34),transparent);
}
.appbar .mark{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;overflow:hidden;
  display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,206,71,.10),rgba(255,187,0,.04));
  border:1px solid rgba(255,206,71,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 4px 14px rgba(255,187,0,.18);
}
.appbar .mark img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.appbar .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.appbar .brand b{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#F5F5F5}
.appbar .brand small{font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;color:#8A9099}
.appbar .spacer{margin-left:auto}

/* ══════════ heading ══════════ */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:4px 0 0}
.head .txt{min-width:0}
.head h1{font-size:19px;font-weight:600;letter-spacing:-.01em;color:#F5F5F5;display:flex;align-items:center;gap:9px}
.head h1 i{font-size:13px;color:var(--accent)}
.head p{margin-top:7px;font-size:11.5px;line-height:1.55;color:var(--muted)}

.chip{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  padding:6px 10px;border-radius:7px;
  border:1px solid var(--line-2);color:#BAC0C8;background:rgba(255,255,255,.03);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  white-space:nowrap;
}
.chip .dot{width:4px;height:4px;border-radius:50%;background:var(--dim);flex-shrink:0}
.chip.ok{color:#FFCE47;border-color:rgba(255,206,71,.32);background:rgba(255,206,71,.08)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 7px rgba(255,206,71,.85)}

/* ══════════ stats ══════════ */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  box-shadow:0 14px 34px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04);
}
.stats div{padding:13px 13px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:none}
.stats small{display:block;font-family:var(--mono);font-size:7px;letter-spacing:.2em;text-transform:uppercase;color:#8A9099;margin-bottom:7px}
.stats b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;color:#E2E5E9}

/* ══════════ notice ══════════ */
.notice{
  display:none;gap:10px;align-items:flex-start;
  padding:13px 14px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,187,0,.06),rgba(255,187,0,.025));
  border:1px solid rgba(255,187,0,.22);
}
.notice.show{display:flex}
.notice i{font-size:11px;color:var(--accent);margin-top:1px;flex-shrink:0}
.notice p{font-size:11px;line-height:1.62;color:#D8C89B}
.notice p b{color:#E0CD9A;font-weight:500}

/* ══════════ terminal ══════════ */
.term{
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#0B0D10,#08090B);
  box-shadow:
    0 22px 60px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.045),
    0 0 0 1px rgba(255,187,0,.05),
    0 0 28px rgba(255,187,0,.06);
  display:flex;flex-direction:column;position:relative;
}
.term::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,206,71,.5),transparent);
}
.term::before{
  content:'';position:absolute;top:0;left:16%;right:16%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.4),transparent);
}
.term-bar{
  display:flex;align-items:center;gap:7px;padding:11px 14px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(199,203,209,.07),rgba(199,203,209,.02));
}
.term-bar .lights{display:flex;gap:5px;flex-shrink:0}
.term-bar .lights i{width:6px;height:6px;border-radius:50%;background:#343A42;display:block}
.term-bar .lights i:first-child{background:rgba(255,187,0,.55);box-shadow:0 0 7px rgba(255,187,0,.5)}
.term-bar .label{
  margin-left:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#8A9099;
}
.term-bar .right{
  margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.12em;
  color:#8A9099;text-transform:uppercase;
}

.log{
  height:min(46vh,330px);min-height:190px;overflow-y:auto;
  padding:15px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.78;
  scrollbar-width:thin;scrollbar-color:#2A2F36 transparent;
}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:#2A2F36;border-radius:3px}
.line{margin-bottom:7px;white-space:pre-wrap;word-break:break-word;animation:fadeIn .16s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.line .ts{color:#8A9099;margin-right:7px}
.line.sys  .txt{color:#B4BAC2}
.line.echo .txt{color:#E2E5E9}
.line.echo .p{color:var(--accent)}
.line.ok   .txt{color:#FFCE47}
.line.err  .txt{color:#FFBB00}
.line.dim  .txt{color:#A2A9B1}

.input-row{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-top:1px solid var(--line);background:rgba(255,255,255,.02);
  position:relative;
}
.input-row .prompt{font-family:var(--mono);font-size:12px;color:var(--accent);flex-shrink:0}
.input-row input{
  flex:1;background:none;border:none;outline:none;min-width:0;
  font-family:var(--mono);font-size:12px;color:#E8EAED;letter-spacing:.02em;
}
.input-row input::placeholder{color:#8A9099}
.input-row .send{
  width:31px;height:31px;flex-shrink:0;border-radius:9px;cursor:pointer;
  display:grid;place-items:center;font-size:11px;
  color:#08090B;background:linear-gradient(180deg,#FFCE47,#FFBB00);
  border:1px solid rgba(255,206,71,.6);transition:background .16s,border-color .16s,box-shadow .16s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(255,187,0,.25);
}
.input-row .send:hover:not(:disabled){background:linear-gradient(180deg,#FFDC7A,#FFC31F);border-color:rgba(255,220,122,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(255,187,0,.45)}
.input-row .send:disabled{opacity:.35;cursor:not-allowed}

/* suggestions */
.sugg{
  display:none;position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);
  max-height:210px;overflow-y:auto;
  background:#111317;border:1px solid var(--line-2);border-radius:12px;
  box-shadow:0 -14px 42px rgba(0,0,0,.85);z-index:20;padding:5px;
}
.sugg.show{display:block;animation:fadeIn .13s ease both}
.sugg button{
  display:flex;width:100%;align-items:center;gap:9px;text-align:left;
  background:none;border:none;cursor:pointer;padding:8px 9px;border-radius:8px;
  font-family:var(--mono);font-size:11px;color:#D5D9DE;
}
.sugg button:hover,.sugg button.sel{background:rgba(255,187,0,.1)}
.sugg button:focus-visible{outline:1px solid rgba(255,187,0,.5);outline-offset:-1px;background:rgba(255,187,0,.1)}
.sugg button .nm{color:var(--accent-hi);flex-shrink:0}
.sugg button .ds{color:#A2A9B1;font-size:9.5px;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .none{padding:10px;font-family:var(--mono);font-size:9.5px;color:#8A9099;text-align:center}

/* ══════════ command registry ══════════ */
.card{
  background:
    radial-gradient(120% 80% at 50% -20%,rgba(255,187,0,.055),transparent 62%),
    linear-gradient(180deg,rgba(199,203,209,.055),rgba(199,203,209,.014));
  border:1px solid var(--line);border-radius:16px;padding:17px;
  box-shadow:
    0 18px 48px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 0 rgba(255,187,0,.10);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.card-title{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#DFE2E7}
.card-title i{font-size:9.5px;color:var(--accent)}
.card-title .count{margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:#8A9099;text-transform:none}

.cmd-list{
  margin-top:12px;display:flex;flex-direction:column;gap:1px;
  max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2A2F36 transparent;
}
.cmd-list::-webkit-scrollbar{width:3px}
.cmd-list::-webkit-scrollbar-thumb{background:#2A2F36;border-radius:3px}
.cmd{
  display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border-radius:9px;
  cursor:pointer;transition:background .15s,border-color .15s;border:1px solid transparent;
}
.cmd:hover{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.06)}
.cmd .n{font-family:var(--mono);font-size:11px;color:var(--accent-hi);flex-shrink:0;min-width:86px}
.cmd .body{flex:1;min-width:0}
.cmd .d{display:block;font-size:10.5px;color:#BAC0C8;line-height:1.5}
.cmd .u{display:block;font-family:var(--mono);font-size:9px;color:#A2A9B1;margin-top:4px;word-break:break-all}
.lvl{
  font-family:var(--mono);font-size:7px;letter-spacing:.12em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:5px;flex-shrink:0;margin-top:1px;
  border:1px solid var(--line);color:#A9AFB7;background:rgba(199,203,209,.04);
  white-space:nowrap;
}
.lvl.premium{border-color:rgba(255,187,0,.34);color:#FFCE47;background:rgba(255,187,0,.08)}
.lvl.admin{border-color:rgba(255,187,0,.34);color:#FFBB00;background:rgba(255,187,0,.08)}
.lvl.registered{border-color:rgba(199,203,209,.3);color:#C7CBD1;background:rgba(199,203,209,.07)}
.lvl.public{border-color:rgba(255,206,71,.28);color:#FFCE47;background:rgba(255,206,71,.07)}

/* ══════════ toast ══════════ */
.toast{
  position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));
  transform:translate(-50%,-140%);z-index:99;
  max-width:min(350px,calc(100vw - 32px));
  background:#1B1F25;border:1px solid var(--line-2);border-radius:12px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:9px;
  box-shadow:0 20px 52px rgba(0,0,0,.9);
  transition:transform .32s cubic-bezier(.3,1.25,.5,1),opacity .22s;opacity:0;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast i{font-size:11px;margin-top:2px;flex-shrink:0}
.toast.ok i{color:var(--ok)}.toast.err i{color:var(--danger)}
.toast span{font-size:11.5px;line-height:1.5;color:#E2E5E9}

/* ══════════ nav ══════════ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:stretch;
  background:
    radial-gradient(80% 160% at 50% 190%,rgba(255,187,0,.12),transparent 70%),
    linear-gradient(180deg,rgba(21,24,29,.92),rgba(17,19,23,.96));
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-top:1px solid rgba(255,206,71,.18);
  box-shadow:0 -12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,187,0,.04);
}
.nav::before{
  content:'';position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,187,0,.28),transparent);
}
.nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  text-decoration:none;color:#A2A9B1;transition:color .18s;position:relative;
}
.nav a i{font-size:14px}
.nav a span{font-family:var(--mono);font-size:7px;letter-spacing:.16em;text-transform:uppercase}
.nav a:hover{color:#C7CBD1}
.nav a:focus-visible{outline:1px solid rgba(255,187,0,.5);outline-offset:-3px;border-radius:8px}
.nav a.active{color:var(--accent-hi)}
.nav a.active::after{
  content:'';position:absolute;top:0;width:28px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent-hi),transparent);
  box-shadow:0 0 10px rgba(255,187,0,.65),0 0 22px rgba(255,206,71,.3);
}
.nav a.active::before{
  content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:64px;height:calc(100% + 1px);pointer-events:none;
  background:radial-gradient(50% 46% at 50% 0%,rgba(255,187,0,.16),transparent 72%);
}
.nav .pf{flex:0 0 62px}
.nav .pf .av{
  width:27px;height:27px;border-radius:50%;overflow:hidden;
  border:1px solid var(--line-2);background:rgba(255,255,255,.045);
  display:grid;place-items:center;color:#B4BAC2;font-size:10px;
}
.nav .pf .av img{width:100%;height:100%;object-fit:cover;display:block}
.nav .pf.active .av{border-color:rgba(255,187,0,.55);box-shadow:0 0 0 2px rgba(255,187,0,.1)}

@media (max-width:400px){
  :root{--pad:14px}
  .head h1{font-size:17.5px}
  .stats div{padding:10px}
  .cmd .n{min-width:74px}
}

/* the terminal input has no box of its own; light up the whole row instead */

  content:'';position:absolute;top:-1px;left:0;right:0;height:1px;

}

/* etched gold grid becomes a quiet geometric signature */
body::before{background-image:linear-gradient(rgba(212,175,55,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.06) 1px,transparent 1px)!important;background-size:56px 56px!important;opacity:.13!important;mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 68%)!important}
/* Fine double-edge glass, warm internal reflection and deep but clean lift */
.card,.identity,.modal-card{position:relative;border-radius:15px!important;background:linear-gradient(138deg,rgba(28,27,23,.94) 0%,rgba(17,17,16,.96) 42%,rgba(9,9,9,.96) 100%)!important;border:1px solid rgba(212,175,55,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.085),inset 1px 0 0 rgba(255,255,255,.018),inset 0 -1px 0 rgba(212,175,55,.055),0 16px 42px rgba(0,0,0,.48),0 3px 9px rgba(0,0,0,.36)!important;transition:border-color .24s ease,box-shadow .24s ease,transform .24s ease!important}
.card::after,.identity::after{content:'';position:absolute;pointer-events:none;inset:1px;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 23%,transparent 74%,rgba(212,175,55,.025));opacity:.8}
.card:hover,.identity:hover{border-color:rgba(255,201,74,.34)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 20px 48px rgba(0,0,0,.56),0 0 22px rgba(212,175,55,.055)!important;transform:translateY(-1px)}
.card-title{font-size:10px!important;letter-spacing:.18em!important;color:#E9E5D8!important}
.card-title i,.head h1 i{color:#D4AF37!important;text-shadow:0 0 8px rgba(212,175,55,.24)}
.head h1{letter-spacing:-.025em;text-shadow:0 2px 18px rgba(255,255,255,.045)}
.head p,.desc,.card-sub{color:#A7A7A3!important}
/* gold marker rule gives each content header a deliberate editorial anchor */
.head h1{position:relative}
.head h1::after{content:'';display:block;width:38px;height:2px;margin-top:9px;border-radius:2px;background:linear-gradient(90deg,#FFD700,#D4AF37 60%,transparent);box-shadow:0 0 8px rgba(212,175,55,.22)}
.appbar,.nav{border-color:rgba(212,175,55,.20)!important;box-shadow:0 10px 28px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.045)!important}
.brand{letter-spacing:.015em}.brand b{color:#F3F1E9!important}.brand small{color:#8F8F89!important;letter-spacing:.09em}
.top-brand .brand-mark,.mark img{filter:drop-shadow(0 1px 1px rgba(255,255,255,.27)) drop-shadow(0 0 6px rgba(255,215,0,.36)) drop-shadow(0 0 15px rgba(212,175,55,.16))!important}
/* beveled gold controls; restrained light only on interaction */
.btn{border-radius:10px!important;letter-spacing:.025em;min-height:40px}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#FFE58A 0%,#E2BD4A 27%,#C59B27 70%,#8F6500 100%)!important;border-color:rgba(255,215,0,.63)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(75,52,0,.32),0 5px 15px rgba(0,0,0,.26),0 0 10px rgba(212,175,55,.13)!important}
.btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.68),0 7px 19px rgba(0,0,0,.32),0 0 16px rgba(255,201,74,.24)!important}
.btn:not(:disabled):active{transform:translateY(0) scale(.99)}
.btn.ghost,.top-link,.link,.logout{border-radius:9px!important;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(12,12,12,.38))!important;border-color:rgba(212,175,55,.25)!important}
input,select,textarea,.inp{border-radius:10px!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.32)!important}
input:focus,select:focus,textarea:focus,.inp:focus-within{border-color:rgba(255,215,0,.66)!important;box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 0 0 1px rgba(212,175,55,.14),0 0 15px rgba(255,201,74,.10)!important}
:focus-visible{outline:2px solid rgba(255,215,0,.68)!important;outline-offset:3px}
/* polished icon tokens and clear active navigation */
.nav a i{color:rgba(212,175,55,.68)!important;transition:color .2s ease,filter .2s ease,transform .2s ease}
.nav a:hover i{color:#FFC94A!important;filter:drop-shadow(0 0 5px rgba(255,201,74,.3));transform:translateY(-1px)}
.nav a.active i{color:#FFD700!important;filter:drop-shadow(0 0 7px rgba(255,215,0,.42))!important}
.nav a.active span{color:#F5D76E!important}
.nav a.active::after{height:2px!important;box-shadow:0 0 9px rgba(255,215,0,.45)!important}
/* quiet holographic sheen, one slow sweep rather than constant noisy neon */
@keyframes goldSheen{0%,72%,100%{transform:translateX(-130%) skewX(-15deg);opacity:0}78%{opacity:.5}92%{transform:translateX(230%) skewX(-15deg);opacity:0}}
.logo-mark,.ring-glow{will-change:opacity}
.top-brand .brand-mark{animation:brandGlow 6s ease-in-out infinite}
@keyframes brandGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(212,175,55,.22))}50%{filter:drop-shadow(0 0 8px rgba(255,215,0,.4))}}
.bot-head,.bot-body{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -8px 16px rgba(0,0,0,.42),0 10px 22px rgba(0,0,0,.4),0 0 12px rgba(212,175,55,.08)!important}
.bot-visor{border-color:rgba(255,215,0,.38)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 13px rgba(212,175,55,.12)!important}
/* screens with data collections remain comfortable on narrow mobile */
@media(max-width:480px){.card,.identity{border-radius:13px!important}.card-title{letter-spacing:.14em!important}.nav a i{font-size:14px}.btn{min-height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001s!important}.card:hover,.identity:hover,.btn:not(:disabled):hover{transform:none}}

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var log = $('log'), input = $('cmdInput'), sendBtn = $('sendBtn'),
    sugg = $('sugg'), cmdList = $('cmdList'), cmdCount = $('cmdCount');

var COMMANDS = [];
var history = [];
var histIdx = -1;
var suggIdx = -1;
var suggItems = [];

function toast(msg, type){
  $('toastText').textContent = msg;
  var icon = $('toastIcon');
  $('toast').className = 'toast ' + (type === 'ok' ? 'ok' : 'err');
  icon.className = 'fa-solid ' + (type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation');
  void $('toast').offsetWidth;
  $('toast').classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ $('toast').classList.remove('show'); }, 3600);
}

function api(url, opts){
  return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}))
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .catch(function(){ return { status: 0, body: { ok: false, error: 'Network error.' } }; });
}

function stamp(){
  var d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2);
}

function write(kind, text, withPrompt){
  var el = document.createElement('div');
  el.className = 'line ' + kind;
  var safe = String(text).replace(/[&<>]/g, function(c){
    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
  });
  el.innerHTML = '<span class="ts">' + stamp() + '</span>' +
    (withPrompt ? '<span class="p">$ </span>' : '') +
    '<span class="txt">' + safe + '</span>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function escapeAttr(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

/* ── bootstrap ── */
api('/api/session').then(function(res){
  if (!res.body || !res.body.loggedIn){ location.replace('/login.html'); return; }
  var u = res.body.user || {};
  if (u.avatar){
    $('pfAv').innerHTML = '<img alt="" src="/api/profile/avatar/' + encodeURIComponent(u.avatar) + '"/>';
  }
  $('chip').className = 'chip ok';
  $('chipText').textContent = u.premiumActive ? 'premium' : 'member';
  $('stLevel').textContent = u.premiumActive ? 'premium' : 'member';
  $('sessionNote').textContent = 'uid ' + (u.uid || '—');

  write('sys', 'CIPHER BVG terminal ready.');
  write('dim', 'Signed in as ' + u.username + ' · level ' + (u.premiumActive ? 'premium' : 'registered'));
  write('dim', 'Type / to list commands, or tap a command below.');
  write('dim', '');

  loadCommands();

  api('/api/health').then(function(h){
    var d = h.body || {};
    // attack commands need the payload layer specifically
    if (d.cmd !== 'ready'){
      $('stEngine').textContent = 'offline';
      $('engineNotice').classList.add('show');
      $('engineNoticeText').innerHTML =
        '<b>Command execution is offline.</b> The WhatsApp engine is not installed on this server, ' +
        'so attack commands cannot run. Informational commands still work.';
    } else {
      $('stEngine').textContent = 'ready';
    }
  });
});

function loadCommands(){
  api('/api/cmd/list').then(function(res){
    if (res.status === 401){ location.replace('/login.html'); return; }
    COMMANDS = (res.body && res.body.commands) || [];
    cmdCount.textContent = COMMANDS.length + ' total';
    $('stCommands').textContent = String(COMMANDS.length);
    renderList();
  });
}

function renderList(){
  if (!COMMANDS.length){
    cmdList.innerHTML = '<div class="none" style="padding:18px">No commands registered</div>';
    return;
  }
  cmdList.innerHTML = COMMANDS.map(function(c){
    var lvl = c.level || 'public';
    return '<div class="cmd" data-name="' + escapeAttr(c.name) + '">' +
      '<span class="n">/' + escapeAttr(c.name) + '</span>' +
      '<span class="body"><span class="d">' + escapeAttr(c.description || '') + '</span>' +
      '<span class="u">' + escapeAttr(c.usage || ('/' + c.name)) + '</span></span>' +
      '<span class="lvl ' + escapeAttr(lvl) + '">' + escapeAttr(lvl) + '</span>' +
    '</div>';
  }).join('');
}

cmdList.addEventListener('click', function(e){
  var row = e.target.closest('.cmd');
  if (!row) return;
  var name = row.getAttribute('data-name');
  var def = COMMANDS.filter(function(c){ return c.name === name; })[0];
  if (!def) return;
  // prefill the usage template so the user only supplies the target
  var usage = def.usage || ('/' + name);
  var needsArg = /<.+>/.test(usage);
  input.value = needsArg ? '/' + name + ' ' : '/' + name;
  hideSugg();
  input.focus();
  if (input.setSelectionRange) input.setSelectionRange(input.value.length, input.value.length);
});

/* ── suggestions ── */
function hideSugg(){
  sugg.classList.remove('show');
  suggIdx = -1;
  suggItems = [];
}

function showSugg(query){
  var q = query.toLowerCase();
  var matches = COMMANDS.filter(function(c){
    return c.name.toLowerCase().indexOf(q) === 0;
  });
  if (!matches.length || !q){
    hideSugg();
    return;
  }
  suggItems = matches;
  sugg.innerHTML = matches.map(function(c){
    return '<button data-name="' + escapeAttr(c.name) + '">' +
      '<span class="nm">/' + escapeAttr(c.name) + '</span>' +
      '<span class="ds">' + escapeAttr(c.description || '') + '</span>' +
    '</button>';
  }).join('');
  sugg.classList.add('show');
  suggIdx = -1;
}

sugg.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  var name = b.getAttribute('data-name');
  var def = COMMANDS.filter(function(c){ return c.name === name; })[0];
  var usage = def && def.usage ? def.usage : '/' + name;
  input.value = /<.+>/.test(usage) ? '/' + name + ' ' : '/' + name;
  hideSugg();
  input.focus();
});

/* ── input handling ── */
input.addEventListener('input', function(){
  var v = input.value;
  if (v.charAt(0) === '/' && v.indexOf(' ') === -1){
    showSugg(v.slice(1));
  } else {
    hideSugg();
  }
});

input.addEventListener('keydown', function(e){
  // arrow navigation inside suggestions
  if (sugg.classList.contains('show') && suggItems.length){
    var btns = sugg.querySelectorAll('button');
    if (e.key === 'ArrowDown'){
      e.preventDefault();
      suggIdx = (suggIdx + 1) % btns.length;
      btns.forEach(function(b, i){ b.classList.toggle('sel', i === suggIdx); });
      return;
    }
    if (e.key === 'ArrowUp'){
      e.preventDefault();
      suggIdx = (suggIdx - 1 + btns.length) % btns.length;
      btns.forEach(function(b, i){ b.classList.toggle('sel', i === suggIdx); });
      return;
    }
    if (e.key === 'Tab' || (e.key === 'Enter' && suggIdx >= 0)){
      e.preventDefault();
      var pick = suggItems[suggIdx >= 0 ? suggIdx : 0];
      if (pick){
        var usage = pick.usage || ('/' + pick.name);
        input.value = /<.+>/.test(usage) ? '/' + pick.name + ' ' : '/' + pick.name;
        hideSugg();
      }
      return;
    }
    if (e.key === 'Escape'){ hideSugg(); return; }
  }

  if (e.key === 'Enter'){ e.preventDefault(); run(); return; }

  // command history
  if (e.key === 'ArrowUp' && !sugg.classList.contains('show') && history.length){
    e.preventDefault();
    histIdx = Math.min(histIdx + 1, history.length - 1);
    input.value = history[history.length - 1 - histIdx] || '';
    return;
  }
  if (e.key === 'ArrowDown' && !sugg.classList.contains('show')){
    e.preventDefault();
    histIdx = Math.max(histIdx - 1, -1);
    input.value = histIdx === -1 ? '' : (history[history.length - 1 - histIdx] || '');
  }
});

sendBtn.addEventListener('click', run);

var busy = false;
function run(){
  var raw = (input.value || '').trim();
  hideSugg();
  if (!raw || busy) return;

  history.push(raw);
  histIdx = -1;
  input.value = '';
  write('echo', raw, true);

  if (raw.charAt(0) !== '/'){
    write('err', 'Commands must start with /. Type / to browse.');
    return;
  }

  busy = true;
  sendBtn.disabled = true;

  api('/api/cmd/execute', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command: raw })
  }).then(function(res){
    var b = res.body || {};
    if (b.ok){
      write('ok', b.message || 'Done.');
    } else {
      write('err', b.error || 'Command failed.');
      if (b.code === 'NO_SESSION'){
        write('dim', 'No WhatsApp session is active. Link a device in the PAIR section.');
      }
    }
  }).finally(function(){
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  });
}

input.focus();
</script>
</body>
