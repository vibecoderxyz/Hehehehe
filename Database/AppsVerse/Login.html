<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIPHER BVG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Orbitron:wght@700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #050310;
      --purple:    #a78bfa;
      --purple2:   #c4b5fd;
      --purple-d:  #7c3aed;
      --purple-xd: #4c1d95;
      --cyan:      #22d3ee;
      --cyan-d:    #0891b2;
      --cyan-dim:  rgba(34,211,238,0.45);
      --amber:     #fbbf24;
      --amber-d:   #d97706;
      --amber-dim: rgba(251,191,36,0.4);
      --rose:      #fb7185;
      --rose-d:    #e11d48;
      --rose-dim:  rgba(251,113,133,0.4);
      --green:     #10b981;
      --red:       #ef4444;
      --text:      #e2e8f0;
      --muted:     rgba(196,181,253,0.3);
      --font-d:    'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      --font-ui:   'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'Space Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
      --blur:      blur(48px) saturate(2.5);
    }

    html, body {
      min-height: 100vh; width: 100%;
      background: var(--bg);
      font-family: var(--font-ui);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }

    /* ambient light bg — vivid so glass soaks it up */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 15%  5%,  rgba(109,40,217,0.60) 0%, transparent 55%),
        radial-gradient(ellipse 65% 55% at 85% 88%,  rgba(34,211,238,0.32) 0%, transparent 52%),
        radial-gradient(ellipse 50% 45% at 65% 28%,  rgba(251,191,36,0.16) 0%, transparent 48%),
        radial-gradient(ellipse 45% 40% at 30% 72%,  rgba(139,92,246,0.28) 0%, transparent 50%),
        radial-gradient(ellipse 40% 35% at 75% 15%,  rgba(251,113,133,0.18) 0%, transparent 46%);
    }

    /* scanline */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 6px);
    }

    /* grid */
    .grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        linear-gradient(rgba(139,92,246,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,0.025) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── SHELL ── */
    .shell { position: relative; z-index: 2; width: min(92vw, 400px); }

    /* ── IDENTITY BLOCK ── */
    .id-block {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-bottom: none;
      border-radius: 26px 26px 0 0;
      padding: 34px 28px 28px;
      text-align: center;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      position: relative; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 -2px 60px rgba(109,40,217,0.12);
    }
    /* top glow line */
    .id-block::before {
      content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 1.5px;
      background: linear-gradient(90deg,
        transparent,
        rgba(34,211,238,0.7)  15%,
        rgba(139,92,246,1)    35%,
        rgba(196,181,253,1)   50%,
        rgba(251,191,36,0.8)  70%,
        rgba(139,92,246,0.9)  85%,
        transparent);
      box-shadow: 0 0 24px rgba(139,92,246,0.8), 0 0 48px rgba(34,211,238,0.25), 0 0 70px rgba(251,191,36,0.12);
    }
    /* inner specular */
    .id-block::after {
      content: ''; position: absolute; top: 0; left: 0; width: 55%; height: 55%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
      border-radius: 26px 0 0 0; pointer-events: none;
    }

    /* logo area */
    .logo-wrap { position: relative; display: inline-block; margin-bottom: 22px; }
    .logo-img {
      width: 88px; height: 88px; border-radius: 22px; object-fit: cover;
      border: 1px solid rgba(139,92,246,0.35);
      box-shadow:
        0 0 0 6px rgba(139,92,246,0.09),
        0 0 0 12px rgba(139,92,246,0.04),
        0 0 54px rgba(139,92,246,0.55),
        0 0 100px rgba(109,40,217,0.28),
        inset 0 1px 0 rgba(255,255,255,0.16);
      display: block;
      backdrop-filter: blur(12px);
    }
    /* corner brackets */
    .logo-wrap::before, .logo-wrap::after { content: ''; position: absolute; width: 16px; height: 16px; }
    .logo-wrap::before {
      top: -6px; left: -6px;
      border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
      border-radius: 4px 0 0 0;
      box-shadow: -2px -2px 8px rgba(34,211,238,0.4);
    }
    .logo-wrap::after {
      bottom: -6px; right: -6px;
      border-bottom: 2px solid var(--amber); border-right: 2px solid var(--amber);
      border-radius: 0 0 4px 0;
      box-shadow: 2px 2px 8px rgba(251,191,36,0.35);
    }
    .logo-fallback {
      display: none; width: 88px; height: 88px; border-radius: 22px;
      background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.25);
      align-items: center; justify-content: center; font-size: 44px;
      backdrop-filter: blur(12px);
    }
    .status-badge {
      position: absolute; bottom: -7px; right: -7px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); border: 3px solid rgba(5,3,16,0.95);
      box-shadow: 0 0 12px rgba(16,185,129,0.9);
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%,100%{ box-shadow: 0 0 8px rgba(16,185,129,0.6); }
      50%{ box-shadow: 0 0 22px rgba(16,185,129,1), 0 0 40px rgba(16,185,129,0.4); }
    }

    .sys-name {
      font-family: var(--font-d); font-size: 18px; font-weight: 900;
      letter-spacing: 5px; margin-bottom: 5px;
      background: linear-gradient(135deg, #22d3ee 0%, #a78bfa 35%, #c4b5fd 65%, #fbbf24 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 32px rgba(139,92,246,0.7));
    }
    .sys-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 3.5px; color: rgba(196,181,253,0.35); text-transform: uppercase; margin-bottom: 5px; }
    .sys-credit { font-family: var(--font-mono); font-size: 10px; color: rgba(139,92,246,0.38); }
    .sys-credit a { color: rgba(196,181,253,0.5); text-decoration: none; transition: color 0.2s; }
    .sys-credit a:hover { color: var(--purple); }
    .sys-meta { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
    .sys-chip {
      font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.28); color: rgba(16,185,129,0.9);
      display: flex; align-items: center; gap: 4px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .sys-chip-amber { background: rgba(251,191,36,0.07); border-color: rgba(251,191,36,0.28); color: rgba(251,191,36,0.85); }
    .sys-chip-cyan  { background: rgba(34,211,238,0.07); border-color: rgba(34,211,238,0.28); color: rgba(34,211,238,0.85); }
    .sys-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px rgba(16,185,129,0.9); animation: statusPulse 2s ease-in-out infinite; flex-shrink: 0; }

    /* divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg,
        rgba(139,92,246,0.04),
        rgba(139,92,246,0.22) 30%,
        rgba(196,181,253,0.30) 50%,
        rgba(139,92,246,0.22) 70%,
        rgba(139,92,246,0.04));
      position: relative; z-index: 3;
    }

    /* ── FORM BLOCK ── */
    .form-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.13);
      border-top: none;
      border-radius: 0 0 26px 26px;
      padding: 28px 28px 24px;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow: 0 24px 80px rgba(0,0,0,0.25), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    /* bottom glow line */
    .form-block::after {
      content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139,92,246,0.3), transparent);
    }

    /* field labels */
    .field-lbl {
      font-family: var(--font-mono); font-size: 9px; font-weight: 700;
      letter-spacing: 2.5px; color: rgba(167,139,250,0.45);
      text-transform: uppercase; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .field-lbl::before {
      content: ''; display: inline-block; width: 3px; height: 10px; border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan), var(--cyan-d));
      box-shadow: 0 0 8px rgba(34,211,238,0.6); flex-shrink: 0;
    }
    .field-lbl::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(139,92,246,0.18), transparent);
    }

    .input-wrap { position: relative; margin-bottom: 22px; }
    .input-field {
      width: 100%; padding: 14px 46px 14px 46px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(40px) saturate(2.2);
      -webkit-backdrop-filter: blur(40px) saturate(2.2);
      color: var(--text); font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.5px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        inset 0 -1px 0 rgba(0,0,0,0.3),
        0 4px 20px rgba(0,0,0,0.3);
      transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
      outline: none; -webkit-appearance: none;
    }
    .input-field::placeholder { color: rgba(139,92,246,0.2); }
    .input-field:focus {
      border-color: rgba(34,211,238,0.45);
      background: rgba(34,211,238,0.04);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 0 0 3px rgba(34,211,238,0.12),
        0 0 24px rgba(34,211,238,0.08);
    }
    .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: rgba(139,92,246,0.3); pointer-events: none; z-index:1;
      transition: color 0.2s;
    }
    .input-wrap:focus-within .input-icon { color: var(--cyan); }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(139,92,246,0.3); cursor: pointer;
      font-size: 13px; padding: 4px; transition: color 0.18s;
    }
    .eye-btn:hover { color: var(--cyan); }

    /* ── SUBMIT ── */
    .btn-login {
      width: 100%; padding: 14px; margin-top: 6px;
      border-radius: 14px; cursor: pointer;
      font-family: var(--font-d); font-size: 13px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase; color: #fff;
      border: 1px solid rgba(34,211,238,0.32);
      background: linear-gradient(135deg,
        rgba(7,130,162,0.55)  0%,
        rgba(34,211,238,0.42) 40%,
        rgba(100,30,210,0.48) 70%,
        rgba(7,130,162,0.55)  100%);
      background-size: 220% 100%;
      animation: shimmer 5s linear infinite;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.3),
        0 6px 36px rgba(34,211,238,0.2);
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.18s, box-shadow 0.18s;
      backdrop-filter: blur(10px);
    }
    .btn-login::before {
      content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-12deg);
      animation: sweep 4.5s ease-in-out infinite;
    }
    .btn-login::after {
      content: ''; position: absolute; top: 0; left: 6%; right: 6%; height: 1px;
      background: rgba(255,255,255,0.22);
    }
    @keyframes sweep   { 0%,100%{left:-70%;} 50%{left:130%;} }
    @keyframes shimmer { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.25),
        0 12px 50px rgba(34,211,238,0.36),
        0 0 60px rgba(139,92,246,0.2);
      border-color: rgba(34,211,238,0.55);
    }
    .btn-login:active { transform: translateY(0) scale(0.98); }
    .btn-login:disabled { opacity: 0.45; cursor: not-allowed; transform: none; animation: none; }

    /* footer */
    .footer-link {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 20px; padding: 11px;
      color: rgba(251,191,36,0.4); font-size: 13px;
      text-decoration: none; border-radius: 13px;
      transition: color 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }
    .footer-link:hover { color: var(--amber); background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.08); }

    /* ── DECORATIVE CORNER ORNAMENTS ── */
    .corner-tl, .corner-br {
      position: fixed; z-index: 1; pointer-events: none; opacity: 0.35;
    }
    .corner-tl { top: 20px; left: 20px; width: 60px; height: 60px; border-top: 1px solid rgba(34,211,238,0.5); border-left: 1px solid rgba(34,211,238,0.5); border-radius: 6px 0 0 0; }
    .corner-br { bottom: 20px; right: 20px; width: 60px; height: 60px; border-bottom: 1px solid rgba(251,191,36,0.5); border-right: 1px solid rgba(251,191,36,0.5); border-radius: 0 0 6px 0; }

    /* shake */
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-8px); }
      40%{ transform: translateX(8px); }
      60%{ transform: translateX(-5px); }
      80%{ transform: translateX(5px); }
    }
    .shake { animation: shake 0.4s ease both; }

    /* ── TOAST ── */
    .toast {
      position: fixed; top: 20px; right: 16px; z-index: 9999;
      min-width: 230px; max-width: 290px;
      background: rgba(8,4,20,0.88);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 14px 55px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      transform: translateX(calc(100% + 24px));
      transition: transform 0.42s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 18px 0 0 18px; }
    .toast.success .toast-bar { background: linear-gradient(180deg,#34d399,#10b981); box-shadow: 0 0 12px rgba(52,211,153,0.7); }
    .toast.error   .toast-bar { background: linear-gradient(180deg,#fb7185,#e11d48); box-shadow: 0 0 12px rgba(251,113,133,0.7); }
    .toast.info    .toast-bar { background: linear-gradient(180deg,#22d3ee,#0891b2); box-shadow: 0 0 12px rgba(34,211,238,0.7); }
    .toast.success { border-color: rgba(52,211,153,0.18); }
    .toast.error   { border-color: rgba(251,113,133,0.18); }
    .toast.info    { border-color: rgba(34,211,238,0.18); }
    .toast-inner { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px 11px 18px; }
    .toast-icon-wrap { width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; backdrop-filter: blur(8px); }
    .toast.success .toast-icon-wrap { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.28); color: #34d399; }
    .toast.error   .toast-icon-wrap { background: rgba(251,113,133,0.12); border: 1px solid rgba(251,113,133,0.28); color: #fb7185; }
    .toast.info    .toast-icon-wrap { background: rgba(34,211,238,0.1);   border: 1px solid rgba(34,211,238,0.25);  color: #22d3ee; }
    .toast-content { flex: 1; min-width: 0; }
    .toast-title { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
    .toast.success .toast-title { color: #34d399; }
    .toast.error   .toast-title { color: #fb7185; }
    .toast.info    .toast-title { color: #22d3ee; }
    .toast-msg { font-size: 11px; color: rgba(226,232,240,0.72); line-height: 1.4; }
    .toast-close { background: none; border: none; color: rgba(148,163,184,0.4); font-size: 12px; cursor: pointer; padding: 2px 4px; transition: color 0.15s; flex-shrink: 0; }
    .toast-close:hover { color: rgba(226,232,240,0.7); }
    .toast-progress { height: 2px; background: rgba(255,255,255,0.04); }
    .toast-progress-fill { height: 100%; width: 100%; transition: width linear; }
    .toast.success .toast-progress-fill { background: rgba(52,211,153,0.5); }
    .toast.error   .toast-progress-fill { background: rgba(251,113,133,0.5); }
    .toast.info    .toast-progress-fill { background: rgba(34,211,238,0.5); }

    .spin { animation: btnSpin 0.7s linear infinite; }
    @keyframes btnSpin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .id-block  { padding: 28px 20px 24px; }
      .form-block{ padding: 24px 20px 20px; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.7;"></canvas>

  <!-- corner ornaments -->
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="shell">
    <div class="id-block">
      <div class="logo-wrap">
        <img class="logo-img" id="logoImg"
             src="{{bannerUrl}}"
             alt="CIPHER BVG"
             onerror="this.style.display='none';document.getElementById('logoFb').style.display='flex';">
        <div id="logoFb" class="logo-fallback">☢️</div>
        <div class="status-badge"></div>
      </div>
      <div class="sys-name">CIPHER BVG</div>
      <div class="sys-tag">Restricted Access System · V7</div>
      <div class="sys-credit">by <a href="https://t.me/S7xShamrez" target="_blank" rel="noopener">@S7xShamrez</a></div>
      <div class="sys-meta">
        <span class="sys-chip"><span class="sys-dot"></span>ONLINE</span>
        <span class="sys-chip sys-chip-amber">v7.0.0</span>
        <span class="sys-chip sys-chip-cyan">SECURE</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="form-block">
      <form id="loginForm" method="POST" action="/auth" autocomplete="off" novalidate>
        <div class="field-lbl">Identity</div>
        <div class="input-wrap">
          <span class="input-icon"><i class="fa fa-user"></i></span>
          <input type="text" id="uInput" name="username" class="input-field" placeholder="Username" autocomplete="username"/>
        </div>

        <div class="field-lbl">Security Key</div>
        <div class="input-wrap">
          <span class="input-icon"><i class="fa fa-lock"></i></span>
          <input type="password" id="pInput" name="password" class="input-field" placeholder="Access key" autocomplete="current-password"/>
          <button type="button" class="eye-btn" id="eyeBtn"><i class="fa fa-eye" id="eyeIcon"></i></button>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          <i class="fa fa-terminal"></i> AUTHENTICATE
        </button>
      </form>

      <a class="footer-link" href="https://t.me/Shamrezmainchannel" target="_blank" rel="noopener">
        <i class="fa-brands fa-telegram"></i> Get Premium Access
      </a>
    </div>
  </div>

  <div id="toast" class="toast">
    <div class="toast-bar"></div>
    <div class="toast-inner">
      <div class="toast-icon-wrap"><i id="toastIcon" class="fa fa-circle-info"></i></div>
      <div class="toast-content">
        <div class="toast-title" id="toastTitle">INFO</div>
        <div class="toast-msg" id="toastText"></div>
      </div>
      <button class="toast-close" onclick="this.closest('.toast').classList.remove('show')"><i class="fa fa-xmark"></i></button>
    </div>
    <div class="toast-progress"><div class="toast-progress-fill" id="toastFill"></div></div>
  </div>

  <script>
  /* ── PARTICLE CANVAS ── */
  (function(){
    var cv=document.getElementById('bgCanvas'),ctx=cv.getContext('2d'),W,H;
    var COLS=[
      'rgba(139,92,246,',
      'rgba(167,139,250,',
      'rgba(196,181,253,',
      'rgba(109,40,217,',
      'rgba(34,211,238,',
      'rgba(251,191,36,'
    ];
    var N=70,dots=[];
    function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
    function mk(){
      return{
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.8+0.3,
        vx:(Math.random()-0.5)*0.28, vy:(Math.random()-0.5)*0.28,
        c:COLS[Math.floor(Math.random()*COLS.length)]
      };
    }
    function init(){ resize(); dots=[]; for(var i=0;i<N;i++) dots.push(mk()); }
    function frame(){
      ctx.clearRect(0,0,W,H);
      /* connections */
      for(var i=0;i<dots.length;i++) for(var j=i+1;j<dots.length;j++){
        var dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          ctx.beginPath();
          ctx.strokeStyle=dots[i].c+(1-d/120)*0.09+')';
          ctx.lineWidth=0.5;
          ctx.moveTo(dots[i].x,dots[i].y);
          ctx.lineTo(dots[j].x,dots[j].y);
          ctx.stroke();
        }
      }
      /* dots */
      for(var k=0;k<dots.length;k++){
        var d=dots[k];
        ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
        ctx.fillStyle=d.c+'0.8)';
        ctx.shadowColor=d.c+'0.55)'; ctx.shadowBlur=8;
        ctx.fill(); ctx.shadowBlur=0;
        d.x+=d.vx; d.y+=d.vy;
        if(d.x<0||d.x>W) d.vx=-d.vx;
        if(d.y<0||d.y>H) d.vy=-d.vy;
      }
      requestAnimationFrame(frame);
    }
    window.addEventListener('resize',init); init(); frame();
  }());

  /* ── EYE TOGGLE ── */
  document.getElementById('eyeBtn').addEventListener('click',function(){
    var inp=document.getElementById('pInput'),ico=document.getElementById('eyeIcon');
    if(inp.type==='password'){ inp.type='text'; ico.className='fa fa-eye-slash'; }
    else{ inp.type='password'; ico.className='fa fa-eye'; }
  });

  /* ── TOAST ── */
  function showToast(msg,type){
    type=type||'info';
    var el=document.getElementById('toast');
    var cfg={
      success:{icon:'fa-circle-check',title:'SUCCESS'},
      error:{icon:'fa-circle-xmark',title:'FAILED'},
      info:{icon:'fa-circle-info',title:'INFO'}
    };
    var c=cfg[type]||cfg.info;
    document.getElementById('toastIcon').className='fa '+c.icon;
    document.getElementById('toastTitle').textContent=c.title;
    document.getElementById('toastText').textContent=msg;
    el.className='toast '+type; void el.offsetWidth; el.classList.add('show');
    var fill=document.getElementById('toastFill');
    fill.style.transition='none'; fill.style.width='100%'; void fill.offsetWidth;
    fill.style.transition='width 4s linear'; fill.style.width='0%';
    clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('show');},4200);
  }

  /* ── URL PARAMS ── */
  (function(){
    var sp=new URLSearchParams(window.location.search),m=sp.get('msg');
    if(m) showToast(decodeURIComponent(m), sp.get('type')||'info');
    if(history.replaceState) history.replaceState(null,'',location.pathname);
  }());

  /* ── FORM SUBMIT ── */
  document.getElementById('loginForm').addEventListener('submit',function(e){
    var u=document.getElementById('uInput').value.trim();
    var p=document.getElementById('pInput').value;
    if(!u||!p){
      e.preventDefault();
      var shell=document.querySelector('.shell');
      shell.classList.remove('shake'); void shell.offsetWidth; shell.classList.add('shake');
      showToast('Fill in all fields','error'); return;
    }
    var btn=document.getElementById('submitBtn');
    btn.disabled=true; btn.innerHTML='<i class="fa fa-circle-notch spin"></i> VERIFYING…';
  });
  </script>
</body>
</html>
